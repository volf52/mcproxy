name: CI

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:  # Allow manual trigger

env:
  GO_VERSION: '1.25.4'

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ env.GO_VERSION }}-

    - name: Download dependencies
      run: go mod download

    - name: Run go fmt
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          echo "Please run 'gofmt -s -w .' to fix formatting issues."
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run tests
      run: go test -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Generate JSON Schema
      id: generate-schema
      run: |
        echo "Generating JSON Schema..."
        ./scripts/generate-schema.sh

        # Check if schema file changed
        if git diff --quiet config.schema.json; then
          echo "schema_changed=false" >> $GITHUB_OUTPUT
          echo "JSON Schema is up to date"
        else
          echo "schema_changed=true" >> $GITHUB_OUTPUT
          echo "JSON Schema has changed and needs to be committed"
        fi

    - name: Commit updated schema
      if: steps.generate-schema.outputs.schema_changed == 'true' && github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add config.schema.json
        git commit -m "🤖 Auto-update JSON Schema

        Generated from Go structs at $(date -u +%Y-%m-%dT%H:%M:%SZ)

        🤖 Generated with [Claude Code](https://claude.com/claude-code)

        Co-Authored-By: GitHub Actions <action@github.com>"
        git push